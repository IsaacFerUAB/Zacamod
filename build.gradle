plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// VEGETTA: En lugar de usar variables externas que pueden fallar, 
// definimos aquí mismo la versión y el grupo. ¡Más seguro!
version = '0.0.1'
group = 'com.zaca.zacamod' // Cambia 'zaca' por tu nombre de usuario

base {
    archivesName = 'zacamod' // Este será el ID de tu mod (todo minúsculas)
}

// Mojang usa Java 17 para la 1.18+, así que nos aseguramos de usarlo.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                // VEGETTA: Aquí ponemos el ID del mod directamente ('zacamod')
                zacamod {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', 'zacamod'
        }

        server {
            property 'forge.enabledGameTestNamespaces', 'zacamod'
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'zacamod'
        }

        data {
            workingDirectory project.file('run-data')
            // VEGETTA: Ajustado para usar el ID 'zacamod'
            args '--mod', 'zacamod', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // VEGETTA: ¡CAMBIO CRÍTICO! 
    // He añadido estos repositorios explícitamente.
    // Sin esto, Gradle no sabe dónde buscar los archivos de Forge y da el error que tenías.
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    mavenCentral()
}

dependencies {
    // VEGETTA: He puesto la versión exacta de Forge para 1.20.1 (47.2.0 es muy estable).
    // Así no dependemos de que la variable ${forge_version} esté bien escrita.
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

// VEGETTA: Este bloque rellena automáticamente el archivo mods.toml
// He puesto los valores a mano para asegurar que no salgan vacíos.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: '1.20.1',
            minecraft_version_range: '[1.20.1, 1.21)',
            forge_version: '47.2.0',
            forge_version_range: '[47,)',
            loader_version_range: '[47,)',
            mod_id: 'zacamod',
            mod_name: 'Zaca Mod',
            mod_license: 'All Rights Reserved',
            mod_version: '0.0.1',
            mod_authors: 'Zaca', // Tu nombre aquí
            mod_description: 'Mod creado siguiendo el tutorial de Vegetta777'
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'zacamod',
                'Specification-Vendor'    : 'Zaca',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'Zaca',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}